[package]
name = "fourche"
description = """\
A simple task queue named after a lion with forked tail \
(queue fourché), works with Redis.\
"""
version = "0.4.0"
edition = "2018"

authors = ["Yasha <yasuhiro.asaka@grauwoelfchen.net>"]
homepage = "https://codeberg.org/grauwoelfchen/fourche"
readme = "README.md"
keywords = ["redis", "queue"]
categories = ["asynchronous"]
documentation = "https://docs.rs/crate/fourche"
repository = "https://codeberg.org/grauwoelfchen/fourche"
license = "Apache-2.0"

exclude = [
  ".cache",
  ".cargo-husky",
  ".builds/*",
  "Makefile",
  "rust-toolchain",
  ".clippy.toml",
  ".rustfmt.toml",
  ".gitignore",
]

[features]
default = ["sync"]
sync = [
  "dep:redis",
]
async = [
  "dep:redis",
  "dep:tokio",
  "redis/aio",
  "redis/tokio-comp",
  "tokio/macros",
]

[badges]
maintenance = { status = "experimental" } # at least while 0.x

[lib]
path = "src/lib.rs"

[[test]]
name = "integration"
path = "test/test.rs"

[profile.release]
panic = "abort"

[dependencies]
redis = { version = "^0.29", features = ["aio", "tokio-comp"], optional = true }
serde = { version = "1.*", features = ["derive"] }
serde_json = "1.*"
tokio = { version = "^1.48", features = ["macros"], optional = true }

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]

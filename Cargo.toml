[package]
name = "fourche"
description = """\
A simple task queue named after a lion with forked tail \
(queue fourché), works with Redis.\
"""
version = "0.2.0"
edition = "2018"

authors = ["Yasha <yasuhiro.asaka@grauwoelfchen.net>"]
homepage = "https://codeberg.org/grauwoelfchen/fourche"
readme = "README.md"
keywords = ["redis", "queue"]
categories = ["asynchronous"]
documentation = "https://docs.rs/crate/fourche"
repository = "https://codeberg.org/grauwoelfchen/fourche"
license = "Apache-2.0"

exclude = [
  ".cache",
  ".cargo-huskey",
  ".builds/*",
  "Makefile",
  "rust-toolchain",
  ".clippy.toml",
  ".rustfmt.toml",
  ".gitignore",
]

[profile.release]
panic = "abort"

[lib]
path = "src/lib.rs"

[[test]]
name = "integration"
path = "test/test.rs"

[dependencies]
redis = "^0.29"
serde = { version = "1.*", features = ["derive"] }
serde_json = "1.*"
